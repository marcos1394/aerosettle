name: CON-59 Devnet RPC gateway and read-only index
on:
  pull_request:
    branches: [master]
    paths:
      - tools/integration/devnet/**
      - tools/discovery/**
      - tools/operations/**
      - tools/marketplace_api/cursor_pagination.py
      - apps/marketplace-web/**
      - evidence/con59/**
      - .github/workflows/con59-devnet-rpc-indexer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gateway-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Python dependencies and offline gateway tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tools/integration/devnet -p 'test_*.py'
          python -m unittest discover -s tools/discovery
          python -m unittest discover -s tools/operations
          python -m unittest discover -s tools/security
          python -m tools.integration.devnet.probe --offline-load > "$RUNNER_TEMP/con59-offline-load.json"
      - name: Economic Ledger regression and release policy
        run: |
          python -m unittest discover -s tools/economic_ledger
          python -m tools.security.workflow_policy
          git diff --check
      - name: SDK and staging regression
        run: |
          cp tools/integration/localnet/aerosettle-idl.json apps/marketplace-web/src/localnet-idl.json
          cp tools/integration/localnet/bootstrap-evidence.json apps/marketplace-web/src/localnet-evidence.json
          npm ci --prefix packages/transaction-sdk --omit=optional
          npm ci --prefix packages/marketplace-sdk
          npm ci --prefix apps/marketplace-web
          npm test --prefix packages/transaction-sdk
          npm test --prefix packages/marketplace-sdk
          npm test --prefix apps/marketplace-web
          npm run build:devnet --prefix apps/marketplace-web
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs devnet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con59-offline-load-${{ github.run_id }}
          path: ${{ runner.temp }}/con59-offline-load.json
          if-no-files-found: error
          retention-days: 30
