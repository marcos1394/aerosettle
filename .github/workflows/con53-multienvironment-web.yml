name: CON-53 multi-environment web
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix packages/transaction-sdk --omit=optional
      - run: npm ci --prefix packages/marketplace-sdk
      - run: npm ci --prefix apps/marketplace-web
      - name: Prepare approved Localnet development fixtures
        run: |
          cp tools/integration/localnet/aerosettle-idl.json apps/marketplace-web/src/localnet-idl.json
          cp tools/integration/localnet/bootstrap-evidence.json apps/marketplace-web/src/localnet-evidence.json
      - run: npm test --prefix packages/transaction-sdk
      - run: npm test --prefix packages/marketplace-sdk
      - name: Web and Wallet Standard connection-race regressions
        run: npm test --prefix apps/marketplace-web
      - run: npm run typecheck --prefix apps/marketplace-web
      - run: npm run build:localnet --prefix apps/marketplace-web
      - run: npm run build:devnet --prefix apps/marketplace-web
      - name: Verify both build graphs, manifests and read-only Devnet output
        run: |
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs localnet
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs devnet
          node apps/marketplace-web/scripts/combine-evidence.mjs
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con53-build-evidence
          path: |
            apps/marketplace-web/dist-localnet/con53-evidence.json
            apps/marketplace-web/dist-devnet/con53-evidence.json
          retention-days: 90
  security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/security -v
      - run: python -m tools.security.workflow_policy
