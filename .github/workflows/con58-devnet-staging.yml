name: CON-58/59 Devnet staging validate
on:
  pull_request:
    branches: [master]
    paths:
      - apps/marketplace-web/**
      - evidence/con58/**
      - packages/transaction-sdk/**
      - packages/marketplace-sdk/**
      - tools/security/**
      - .github/workflows/con58-devnet-staging.yml
  workflow_dispatch:
    inputs:
      operation:
        description: VALIDATE is offline; live snapshot and DEPLOY remain guarded terminal operations
        type: choice
        required: true
        options: [VALIDATE, DEPLOY]
permissions:
  contents: read
jobs:
  validate-prepare:
    if: github.event_name == 'pull_request' || inputs.operation != 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare approved Localnet development fixtures for legacy tests
        run: |
          cp tools/integration/localnet/aerosettle-idl.json apps/marketplace-web/src/localnet-idl.json
          cp tools/integration/localnet/bootstrap-evidence.json apps/marketplace-web/src/localnet-evidence.json
      - name: VALIDATE locked dependencies, frontend and SDK regressions
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix packages/transaction-sdk --omit=optional
          npm ci --prefix packages/marketplace-sdk
          npm ci --prefix apps/marketplace-web
          npm test --prefix packages/transaction-sdk
          npm test --prefix packages/marketplace-sdk
          npm test --prefix apps/marketplace-web
          npm run typecheck --prefix apps/marketplace-web
      - name: VALIDATE release security controls
        run: |
          python -m unittest discover -s tools/security
          python -m tools.security.workflow_policy
          git diff --check
      - name: VALIDATE approved Devnet artifact and offline identity
        run: |
          npm run build:localnet --prefix apps/marketplace-web
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs localnet
          npm run build:devnet --prefix apps/marketplace-web
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs devnet
      - name: Validate release packaging contracts without synthesizing a live snapshot
        run: |
          echo 'CON-59 live snapshots require a fresh verified Devnet scan and exact release approval.'
          echo 'Offline worker, release and adversarial packaging tests ran in npm test.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con58-devnet-staging-${{ github.run_id }}
          path: apps/marketplace-web/dist-devnet/
          if-no-files-found: error
          retention-days: 90
  deploy-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'DEPLOY'
    runs-on: ubuntu-24.04
    steps:
      - name: DEPLOY remains a terminal-only human-approved operation
        run: |
          echo 'Cloudflare Pages staging is deployed by an authorized operator with the guarded terminal procedure.'
          echo 'This workflow has read-only permissions and never receives Cloudflare credentials or publishes from a PR.'
          exit 1
