name: CON-34 real Localnet E2E
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/con34-localnet.yml
      - programs/aerosettle/**
      - tools/integration/localnet/**
      - tools/economic_ledger/CON-34.md
permissions:
  contents: read
jobs:
  localnet:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/con-34-localnet-e2e-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: rustup default 1.89.0
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix tools/bootstrap --omit=optional
      - name: Install pinned Agave CLI
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/agave.tar.bz2" \
            https://github.com/anza-xyz/agave/releases/download/v4.1.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo '5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770  '"$RUNNER_TEMP/agave.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --manifest-path programs/aerosettle/Cargo.toml
      - name: Execute actual validator and restart verification
        env:
          CON34_PUBLIC_REPORT_DIR: ${{ runner.temp }}/con34-public-report
        run: bash tools/integration/localnet/run_localnet_e2e.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: con34-public-localnet-evidence
          path: ${{ runner.temp }}/con34-public-report/*.json
          retention-days: 30
