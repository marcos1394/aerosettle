name: CON-59 Pages read-only operations monitor
on:
  pull_request:
    branches: [master]
    paths:
      - tools/integration/devnet/monitor_pages.py
      - tools/integration/devnet/test_monitor_pages.py
      - .github/workflows/con59-pages-monitor.yml
  schedule:
    # Off the top of the hour to reduce GitHub Actions scheduling contention.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Produce a synthetic failure to test Actions notification routing
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  monitor-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify failure classifications and GitHub annotation format
        run: |
          python -m unittest tools.integration.devnet.test_monitor_pages
          if python -m tools.integration.devnet.monitor_pages --demo \
              --output "$RUNNER_TEMP/con59-demo.json" \
              > "$RUNNER_TEMP/con59-demo-annotations.txt"; then
            echo 'Synthetic incident did not fail as required'
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          data = json.loads((base / 'con59-demo.json').read_text())
          text = (base / 'con59-demo-annotations.txt').read_text()
          assert data['provenance'] == 'SYNTHETIC_TEST'
          assert {'SNAPSHOT_EXPIRED', 'API_503', 'RPC_DEGRADED',
                  'CLOUDFLARE_QUOTA_EXHAUSTED'} <= {x['code'] for x in data['alerts']}
          assert text.count('::error title=CON-59 ') >= 4
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con59-monitor-contract-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/con59-demo.json
            ${{ runner.temp }}/con59-demo-annotations.txt
          retention-days: 30
  public-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe public Pages API and official Devnet RPC without credentials
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            python -m tools.integration.devnet.monitor_pages --demo \
              --output "$RUNNER_TEMP/con59-pages-monitor.json"
          else
            python -m tools.integration.devnet.monitor_pages \
              --output "$RUNNER_TEMP/con59-pages-monitor.json"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con59-pages-monitor-${{ github.run_id }}
          path: ${{ runner.temp }}/con59-pages-monitor.json
          if-no-files-found: warn
          retention-days: 30
