name: CON-55 Premium Devnet marketplace
on:
  pull_request:
    branches: [master]
    paths:
      - apps/marketplace-web/**
      - tools/integration/devnet/**
      - tools/security/**
      - evidence/con55/**
      - .github/workflows/con55-premium-devnet-marketplace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-marketplace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify Python and workflow gates
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tools/integration/devnet
          python -m unittest discover -s tools/security
          python -m tools.security.workflow_policy
      - name: Install repository packages
        run: |
          cp tools/integration/localnet/aerosettle-idl.json apps/marketplace-web/src/localnet-idl.json
          cp tools/integration/localnet/bootstrap-evidence.json apps/marketplace-web/src/localnet-evidence.json
          npm ci --prefix packages/transaction-sdk --omit=optional
          npm ci --prefix packages/marketplace-sdk
          npm ci --prefix apps/marketplace-web
      - name: Verify SDK and premium browser code
        run: |
          npm test --prefix packages/marketplace-sdk
          npm test --prefix packages/transaction-sdk
          npm test --prefix apps/marketplace-web # Includes CON-54 Wallet Standard race tests.
          npm run typecheck --prefix apps/marketplace-web
          npm run build:devnet --prefix apps/marketplace-web
          node --experimental-strip-types apps/marketplace-web/scripts/verify-build.mjs devnet
          git diff --check
